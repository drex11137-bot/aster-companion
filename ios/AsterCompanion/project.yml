name: AsterCompanion
options:
  bundleIdPrefix: com.astercompanion
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_PREVIEWS: YES
    DEVELOPMENT_TEAM: ""
targets:
  AsterCompanion:
    type: application
    platform: iOS
    sources:
      - path: Sources/AsterCompanion
    settings:
      base:
        PRODUCT_NAME: AsterCompanion
        PRODUCT_BUNDLE_IDENTIFIER: com.astercompanion.AsterCompanion
        INFOPLIST_FILE: Sources/AsterCompanion/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/AsterCompanion/Resources/AsterCompanion.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: ScreenBroadcast
  ScreenBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/ReplayKitBroadcastExtension
    settings:
      base:
        PRODUCT_NAME: ScreenBroadcast
        PRODUCT_BUNDLE_IDENTIFIER: com.astercompanion.AsterCompanion.ScreenBroadcast
        INFOPLIST_FILE: Sources/ReplayKitBroadcastExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  AsterCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AsterCompanionTests
    dependencies:
      - target: AsterCompanion
