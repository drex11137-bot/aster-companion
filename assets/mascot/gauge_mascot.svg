<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Mascot Body Gradient -->
    <radialGradient id="mascotBodyGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#232630"/>
      <stop offset="70%" stop-color="#1A1C23"/>
      <stop offset="100%" stop-color="#111318"/>
    </radialGradient>

    <!-- Dial Arc Gradient -->
    <linearGradient id="mascotArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="70%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Needle Gradient -->
    <linearGradient id="mascotNeedle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="mascotShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ground Shadow Oval -->
  <ellipse cx="256" cy="460" rx="140" ry="22" fill="#000000" opacity="0.3"/>

  <!-- Mascot Feet (Compact rounded tabs) -->
  <rect x="180" y="420" width="44" height="32" rx="14" fill="#232630" stroke="#383D4E" stroke-width="4"/>
  <rect x="288" y="420" width="44" height="32" rx="14" fill="#232630" stroke="#383D4E" stroke-width="4"/>

  <!-- Mascot Main Circular Gauge Body -->
  <circle cx="256" cy="240" r="185" fill="url(#mascotBodyGrad)" stroke="#383D4E" stroke-width="8" filter="url(#mascotShadow)"/>

  <!-- Inner Bezel Ring -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="#232630" stroke-width="5"/>

  <!-- Gauge Arc on Forehead (Mascot's "Crown" / Telemetry Arc) -->
  <path d="M 145 200 A 135 135 0 0 1 367 200"
        fill="none"
        stroke="#232630"
        stroke-width="14"
        stroke-linecap="round"/>

  <!-- Active Telemetry Arc Section (Cyan to Emerald) -->
  <path d="M 145 200 A 135 135 0 0 1 290 108"
        fill="none"
        stroke="url(#mascotArcGrad)"
        stroke-width="14"
        stroke-linecap="round"/>

  <!-- Calibration Tick Marks on Brow -->
  <line x1="145" y1="200" x2="155" y2="208" stroke="#F3F4F6" stroke-width="3" stroke-linecap="round"/>
  <line x1="195" y1="130" x2="202" y2="140" stroke="#F3F4F6" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="105" x2="256" y2="118" stroke="#06B6D4" stroke-width="4" stroke-linecap="round"/>
  <line x1="317" y1="130" x2="310" y2="140" stroke="#F3F4F6" stroke-width="3" stroke-linecap="round"/>
  <line x1="367" y1="200" x2="357" y2="208" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>

  <!-- Expressive Inquisitive Eyes -->
  <!-- Left Eye -->
  <circle cx="205" cy="240" r="28" fill="#F3F4F6"/>
  <circle cx="212" cy="238" r="15" fill="#111318"/>
  <circle cx="218" cy="232" r="5" fill="#FFFFFF"/>
  <circle cx="206" cy="245" r="3" fill="#06B6D4"/>

  <!-- Right Eye -->
  <circle cx="307" cy="240" r="28" fill="#F3F4F6"/>
  <circle cx="314" cy="238" r="15" fill="#111318"/>
  <circle cx="320" cy="232" r="5" fill="#FFFFFF"/>
  <circle cx="308" cy="245" r="3" fill="#06B6D4"/>

  <!-- Rosy Instrument Cheeks (Subtle Cyan Glow) -->
  <ellipse cx="165" cy="275" rx="14" ry="8" fill="#06B6D4" opacity="0.35"/>
  <ellipse cx="347" cy="275" rx="14" ry="8" fill="#06B6D4" opacity="0.35"/>

  <!-- Friendly Inquisitive Smile -->
  <path d="M 234 290 Q 256 308 278 290"
        fill="none"
        stroke="#F3F4F6"
        stroke-width="5"
        stroke-linecap="round"/>

  <!-- Interactive Indicator Needle as Mascot's "Antenna / Indicator Tie" -->
  <g transform="translate(256, 175) rotate(-22)">
    <polygon points="0,-45 7,10 0,16 -7,10" fill="url(#mascotNeedle)"/>
    <circle cx="0" cy="12" r="8" fill="#232630" stroke="#383D4E" stroke-width="2"/>
    <circle cx="0" cy="12" r="3" fill="#F3F4F6"/>
  </g>

  <!-- Side Adjustment Dials (Ears / Screws) -->
  <rect x="58" y="224" width="14" height="32" rx="5" fill="#383D4E" stroke="#232630" stroke-width="2"/>
  <rect x="440" y="224" width="14" height="32" rx="5" fill="#383D4E" stroke="#232630" stroke-width="2"/>
</svg>
